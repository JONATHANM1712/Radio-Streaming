<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Radio Song Detector</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <main class="panel">
    <h1>📻 Radio Song Detector</h1>

    <div class="station" id="station">
      Open MOST or KIS
    </div>

    <div class="status">
      <span>Status</span>
      <strong id="status">Stopped</strong>
    </div>

    <button id="start">
      ▶ Start Automatic Detection
    </button>

    <button
      id="stop"
      class="secondary"
    >
      ■ Stop
    </button>

    <div
      class="message"
      id="message"
    >
      Start the local Python recognizer first.
    </div>

    <div class="tip">
      Detection captures 12 seconds of the current radio tab,
      identifies it locally through ShazamIO, then repeats every
      60 seconds.
    </div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
